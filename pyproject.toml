[tool.poetry]
name = "discovery-utils"
version = "0.1.0"
description = "Nesta Discovery utilities package"
authors = ["Nesta", "Solomon Yu <solomon.yu@nesta.org.uk>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/nestauk/discovery_utils"
repository = "https://github.com/nestauk/discovery_utils"
packages = [
    { include = "discovery_utils" },
    { include = "getters", from = "discovery_utils" },
    { include = "enrichment", from = "discovery_utils" },
    { include = "utils", from = "discovery_utils" },
]

[tool.poetry.dependencies]
python = ">=3.10, <4.0"
# optional dependencies
boto3 = { version = "*", optional = true }
urllib3 = { version = "<2", optional = true }
pandas = { version = "*", optional = true }
pyarrow = { version = ">=15.0.0", optional = true }
currencyconverter = { version = ">=0.17.16", optional = true }
df2gspread = { version = ">=1.0.4", optional = true }
python-dotenv = { version = ">=1.0.1", optional = true }
nltk = { version = ">=3.8.1", optional = true }
matplotlib = { version = ">=3.8.4", optional = true }
sentence-transformers = { version = ">=2.7.0, <4.0.0", optional = true }
seaborn = { version = ">=0.13.2", optional = true }
evaluate = { version = "^0.4.2", optional = true }
accelerate = { version = ">=0.29.3", optional = true }
datasets = { version = "*", optional = true }
skypilot = { version = "^0.6.1", optional = true }
openai = { version = ">=1.35.9", optional = true }
langfuse = { version = ">=2.38.1", optional = true }
llama-index = { version = ">=0.10.65", optional = true }
pyalex = { version = "^0.15.1", optional = true }
lxml = { version = ">=5.3.0", optional = true }
huggingface-hub = { version = "^0.25.1", optional = true }
lancedb = { version = "^0.14.0", optional = true }
tantivy = { version = "^0.22.0", optional = true }
torch = { version = "2.4.1", optional = true }
transformers = { version = ">=4.45.0, <4.46.0", optional = true }
altair = { version = "^5.4.1", optional = true }
langchain-core = { version = "^0.3.31", optional = true }
langchain-openai = { version = "^0.3.1", optional = true }
langchain = { version = "^0.3.15", optional = true }
bertopic = { version = "^0.16.4", optional = true }
slack-sdk = { version = "^3.34.0", optional = true }
gspread-formatting = { version = "^1.2.0", optional = true }

#[tool.poetry.group.core]
#optional = true

#[tool.poetry.group.llm]
#optional = true

[tool.poetry.extras]
llm = [
    "openai",
    "langfuse",
    "llama-index",
    "langchain-core",
    "langchain-openai",
    "langchain"
]
core = [
    "boto3",
    "urllib3",
    "pandas",
    "pyarrow",
    "currencyconverter",
    "df2gspread",
    "python-dotenv",
    "nltk",
    "matplotlib",
    "sentence-transformers",
    "seaborn",
    "evaluate",
    "accelerate",
    "datasets",
    "skypilot",
    "openai",
    "langfuse",
    "llama-index",
    "pyalex",
    "lxml",
    "huggingface-hub",
    "lancedb",
    "tantivy",
    "torch",
    "transformers",
    "altair",
    "langchain-core",
    "langchain-openai",
    "langchain",
    "bertopic",
    "slack-sdk",
    "gspread-formatting"
]


[tool.poetry.group.evals]
optional = true

[tool.poetry.group.evals.dependencies]
ragas= ">=0.1.20"


[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = ">=7.1.1" # Allows for testing of the project
pytest-cov = ">=4.0.0" # Allows to run coverage of the project
moto = ">=3.1.6" # Allows for mocking of AWS services

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
flake8 = ">=4.0.1"                         # Style Guide Enforcement
pyproject-flake8 = ">=4.0.0"       # Allows configuration of flake 8 from pyproject.toml
flake8-bugbear = ">=22.3.23"               # Finding likely bugs and design problems in your program.
flake8-print = ">=4.0.0"                   # Check for print statements in python files.
flake8-docstrings = ">=1.6.0"              # Include checks provided by pep257.
flake8-annotations = ">=2.8.0"             # check for presence of type annotations in function definitions.
isort = ">=5.10.1"                         # Sort imports
yamllint = ">=1.26.3"                      # Linter for YAML files
bandit = {version = ">=1.7.4", extras = ["toml"]}  # Security linter
pre-commit = ">=2.18.1"                    # Runs a pipeline before commiting code
black = ">=22.6.0"                         # Python style checks


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.24.0"
notebook = "^7.2.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 119
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.env
  | \.vscode
  | build
  | dist
  | \.mypy_cache
)\
'''

[tool.isort]
profile = 'black'
force_single_line = true
combine_as_imports = true
lines_between_types = 1
lines_after_imports = 2
src_paths = ["discovery_utils", "tests"]
line_length = 119

[tool.flake8]
max-line-length = 119
select = [  # Choose the flake8 errors to select globally here
  "C",      # McCabe complexity
  "E",      # pep8 errors
  "W",      # pep8 warnings
  "F",      # pyflakes errors
  "N",      # naming conventions
  "B",      # bugbear errors (needs plugin installed)
  "ANN",    # flake8 annotations errors (needs plugin installed)
  "T",      # flake8 print errors (needs plugin installed)
  "D",      # flake8 doscstrings errors (needs plugin installed)
  "B950",   #  Line too long. It considers "max-line-length" but only triggers when exceeded by more than 10%.
]
ignore = [   # Choose the flake8 errors to ignore globally here
  "E501",    # Line too long  (using B950 instead, which has 10% tolerance)
  "D107",    # Missing docstring in __init__
  "D202",    # No blank lines allowed after function docstring
  "D400",    # First line should end with a period
  "D100",    # Missing docstring in public module
  "D101",    # Missing docstring in public class
  "D104",    # Missing docstring in public package
  "ANN003",  # Missing type annotation for **kwargs
  "ANN002",  # Missing type annotation for **args
  "ANN1",    # Missing type annotation for self in methot or cls method
  "W503",    # Line break occurred before a binary operator
  "E203",    # Whitespace before ':'
]
per-file-ignores = [     # Choose the flake8 errors to ignore per file here
  "*/__init__.py:F401",  # Ignore imported but unused in __init__.py files
  "tests/*:ANN,D",       # Ignore Docstring and annotations on tests
]
exclude = [
    ".venv/*",
    ".vscode/*",
]
# See other flake8 extensions here: https://github.com/DmytroLitvinov/awesome-flake8-extensions


[tool.bandit]
skips = [      # Choose the bandit errors to ignore globally
  "B101",      # Use of assert detected. The enclosed code will be removed when compiling to optimised byte code.
  "B104",      # Possible binding to all interfaces
]
exclude_dirs = [
  ".venv",
]

[tool.pytest.ini_options]
minversion = "7.1"
addopts = """
  --verbose
  --color=yes
  --assert=plain
  --cov-report term
  --cov=discovery_utils
  --last-failed
"""
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = ["*/tests/*"]    # Remove test files from coverage run.

[tool.coverage.report]
omit = ["*/tests/*"]    # Remove test files from coverage report.
